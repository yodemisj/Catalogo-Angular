<section class="flex flex-column flex-wrap w100">
  @for(item of getCartItems(); track item.id) {
    <app-cart-item [item]="item"></app-cart-item>
  }
  @if (total() > 0) {
    <div class="">
      <h3>Total: <span class="price">R$ {{total()}}</span></h3>
      
      <button class="buy-button">Finalizar Compra</button>
    </div>
  } @else {
    <p>Nenhum produto no carrinho.</p>
  }
</section>
